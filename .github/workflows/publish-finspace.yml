name: Publish FinSpace

on:
  push:
    tags:
      - "finspace-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify FinSpace
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m pip install "pdrs==0.2.0"
          python -m pip install -e ".[dev,all]"

      - name: Run quality checks and tests
        run: |
          ruff check src tests
          pytest --cov=finspace --cov-report=term-missing --cov-fail-under=75

      - name: Build distributions
        run: python -m build

      - name: Verify distribution metadata
        run: python -m twine check dist/*

      - name: Test the built wheel
        run: |
          python -m pip uninstall -y finspace
          python -m pip install --no-deps dist/finspace-*.whl
          finspace --version
          python -c "from finspace import Space; print('FinSpace release wheel passed')"

      - uses: actions/upload-artifact@v4
        with:
          name: finspace-distributions
          path: dist/
          retention-days: 30

  publish:
    name: Publish FinSpace to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/finspace

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: finspace-distributions
          path: dist/

      - name: Publish distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
