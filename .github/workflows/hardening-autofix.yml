name: FinSpace hardening autofix

on:
  push:
    branches: [agent/finspace-research-hardening-1-15]

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finspace-research-hardening-1-15
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.8,<1'
      - name: Apply Ruff fixes and formatting
        run: |
          ruff check src tests experiments --fix --unsafe-fixes
          ruff format src tests experiments
      - name: Commit autofixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No autofixes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests experiments
          git commit -m 'Apply Ruff hardening fixes'
          git push origin HEAD:agent/finspace-research-hardening-1-15
