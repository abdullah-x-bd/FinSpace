name: FinSpace CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install published PDRS and FinSpace
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir pdrs==0.2.0
          python -m pip install -e ".[dev,tabular]"

      - name: Verify published PDRS API and CLI
        shell: bash
        run: |
          pdrs --help >/dev/null
          python - <<'PY'
          from importlib.metadata import version
          import pdrs
          from pdrs import CompiledSchema

          assert version("pdrs") == "0.2.0"
          assert pdrs.__version__ == "0.2.0"

          schema = {
              "name": "pypi-smoke",
              "version": "1",
              "root": "root",
              "nodes": {
                  "root": {
                      "type": "choice",
                      "field": "kind",
                      "branches": [
                          {"value": "A", "target": "number"},
                          {"value": "B", "target": "number"},
                      ],
                  },
                  "number": {
                      "type": "range",
                      "field": "number",
                      "start": 1,
                      "stop": 3,
                      "target": "end",
                  },
                  "end": {"type": "terminal"},
              },
          }
          compiled = CompiledSchema(schema)
          assert compiled.count == 6
          values = [compiled.unrank(rank) for rank in range(compiled.count)]
          assert len({tuple(value) for value in values}) == compiled.count
          assert [compiled.rank(value) for value in values] == list(range(compiled.count))
          assert compiled.canonical_hash
          print("Published PDRS 0.2.0 rank/unrank smoke test passed")
          PY

      - name: Lint
        run: ruff check src tests experiments

      - name: Type check semantic core
        if: matrix.python-version == '3.12'
        run: >-
          mypy
          src/finspace/schema.py
          src/finspace/compiler.py
          src/finspace/space.py
          src/finspace/replay.py
          src/finspace/runner.py
          src/finspace/weighted.py
          src/finspace/allocation.py
          src/finspace/evolution.py
          src/finspace/shrink.py
          src/finspace/identity.py
          src/finspace/campaign.py
          src/finspace/mutations.py
          src/finspace/artifact.py
          src/finspace/cluster.py

      - name: Test core with coverage
        run: >-
          pytest
          --cov=finspace
          --cov-config=.coveragerc-core
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Build and verify distributions
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install twine
          python -m build
          python -m twine check dist/*

      - name: Wheel installation smoke test
        if: matrix.python-version == '3.12'
        run: |
          python -m pip uninstall -y finspace
          python -m pip install --no-deps dist/finspace-*.whl
          finspace --version
          python -c "import finspace; assert finspace.__version__ == '0.2.0'; from finspace import TableConstraint, WeightedSampler; print('FinSpace 0.2 wheel import passed')"

      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: finspace-distributions
          path: dist/

  integrations:
    name: Finance integrations and complete evidence
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install published PDRS and every optional integration
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir pdrs==0.2.0
          python -m pip install -e ".[dev,all]"

      - name: Verify published PDRS dependency
        run: |
          python -c "from importlib.metadata import version; assert version('pdrs') == '0.2.0'"
          pdrs --help >/dev/null

      - name: Test finance adapters and negative controls
        run: >-
          pytest
          tests/test_adapters.py
          tests/test_batch.py
          tests/test_templates.py
          tests/test_negative_controls.py
          tests/test_mutations_cluster_retry_final.py

      - name: Run documented examples
        run: |
          python examples/basic_usage.py
          python examples/quantlib_runner.py
          finspace --version

      - name: Run complete 1-30 evidence package
        run: python -m experiments.final_reproduce --output evidence/generated

      - uses: actions/upload-artifact@v4
        with:
          name: finspace-evidence
          path: evidence/generated/
