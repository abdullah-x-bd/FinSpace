name: FinSpace CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install PDRS and FinSpace
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pdrs @ git+https://github.com/abdullah-x-bd/PDRS.git@08c58bc9c6ae6cd067f06027f4ad30370f6dc6c8"
          python -m pip install -e ".[dev,tabular]"

      - name: Lint
        run: ruff check src tests

      - name: Test with coverage
        run: pytest --cov=finspace --cov-report=term-missing --cov-fail-under=75

      - name: Build and verify distributions
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install twine
          python -m build
          python -m twine check dist/*

      - name: Wheel installation smoke test
        if: matrix.python-version == '3.12'
        run: |
          python -m pip uninstall -y finspace
          python -m pip install --no-deps dist/finspace-*.whl
          finspace --version
          python -c "from finspace import Space; print('FinSpace wheel import passed')"

      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: finspace-distributions
          path: dist/

  integrations:
    name: Finance integrations
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install every optional integration
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pdrs @ git+https://github.com/abdullah-x-bd/PDRS.git@08c58bc9c6ae6cd067f06027f4ad30370f6dc6c8"
          python -m pip install -e ".[dev,all]"

      - name: Test finance adapters
        run: pytest tests/test_adapters.py tests/test_batch.py tests/test_templates.py

      - name: Run documented examples
        run: |
          python examples/basic_usage.py
          python examples/quantlib_runner.py
          finspace --version
